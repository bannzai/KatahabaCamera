# managed-by: setup-ci (bannzai/castle)
# 再生成: /setup-ci (このファイルを手で編集する場合はこのヘッダーを外して手動管理に切り替える)
name: CI Build (xcode)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: アプリをビルドする
        run: |
          xcodebuild build -project "KatahabaCamera.xcodeproj" -scheme "KatahabaCamera" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
